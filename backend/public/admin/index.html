<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FdF 2026 - Gestion</title>
    <link rel="stylesheet" href="/admin/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>FdF 2026</h1>
          <p>Sistema de postulaciones</p>
        </div>
        <button id="logoutButton" class="ghost" type="button" hidden>Cerrar sesion</button>
      </section>

      <section id="loginPanel" class="login-panel">
        <form id="loginForm" class="login-form">
          <label for="adminUsername">Usuario</label>
          <input id="adminUsername" name="adminUsername" type="text" autocomplete="username" required>
          <label for="adminPassword">Contrasena</label>
          <div class="token-row">
            <input id="adminPassword" name="adminPassword" type="password" autocomplete="current-password" required>
            <button type="submit">Entrar</button>
          </div>
          <p id="loginError" class="error" role="alert"></p>
        </form>
      </section>

      <section id="appPanel" class="workspace" hidden>
        <div class="stats" id="stats"></div>

        <div class="toolbar">
          <input id="searchInput" type="search" placeholder="Buscar por nombre, correo, provincia o ID">
          <select id="statusFilter">
            <option value="">Todos los estados</option>
            <option value="NORMALIZED">NORMALIZED</option>
            <option value="WITH_ISSUES">WITH_ISSUES</option>
            <option value="REJECTED">REJECTED</option>
          </select>
          <button id="refreshButton" type="button">Actualizar</button>
        </div>

        <details class="import-panel">
          <summary>Importar JSON offline</summary>
          <form id="offlineJsonForm" class="offline-form">
            <label for="offlineSourceReference">Referencia</label>
            <input id="offlineSourceReference" type="text" placeholder="correo-2026-08-16-001">
            <label for="offlineJsonPayload">JSON</label>
            <textarea id="offlineJsonPayload" rows="9" spellcheck="false" required></textarea>
            <div class="doc-grid">
              <label>
                Carta Aval
                <input id="offlineCartaName" type="text" placeholder="Nombre del archivo">
              </label>
              <label>
                Referencia Carta Aval
                <input id="offlineCartaRef" type="text" placeholder="drive://, ruta o URL">
              </label>
              <label>
                Currículum Vitae
                <input id="offlineCvName" type="text" placeholder="Nombre del archivo">
              </label>
              <label>
                Referencia CV
                <input id="offlineCvRef" type="text" placeholder="drive://, ruta o URL">
              </label>
            </div>
            <div class="action-row single">
              <button type="submit">Importar</button>
            </div>
            <p id="offlineImportResult" class="muted"></p>
          </form>
        </details>

        <details class="import-panel">
          <summary>Registrar offline manual</summary>
          <form id="offlineManualForm" class="offline-form">
            <label for="manualSourceReference">Referencia</label>
            <input id="manualSourceReference" type="text" placeholder="correo-manual-2026-08-16-001">
            <label for="manualRegistrationNote">Nota de registro</label>
            <input id="manualRegistrationNote" type="text" placeholder="Formulario recibido por correo sin JSON">
            <label for="manualResponsesPayload">Respuestas por código FDF</label>
            <textarea id="manualResponsesPayload" rows="9" spellcheck="false" required></textarea>
            <div class="doc-grid">
              <label>
                Carta Aval
                <input id="manualCartaName" type="text" placeholder="Nombre del archivo">
              </label>
              <label>
                Referencia Carta Aval
                <input id="manualCartaRef" type="text" placeholder="drive://, ruta o URL">
              </label>
              <label>
                Currículum Vitae
                <input id="manualCvName" type="text" placeholder="Nombre del archivo">
              </label>
              <label>
                Referencia CV
                <input id="manualCvRef" type="text" placeholder="drive://, ruta o URL">
              </label>
            </div>
            <div class="action-row single">
              <button type="submit">Registrar</button>
            </div>
            <p id="manualImportResult" class="muted"></p>
          </form>
        </details>

        <section class="content-grid">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Recibido</th>
                  <th>Postulante</th>
                  <th>Provincia</th>
                  <th>Origen</th>
                  <th>Estado</th>
                  <th>Admisibilidad</th>
                  <th>Docs</th>
                  <th>Inc.</th>
                </tr>
              </thead>
              <tbody id="submissionsTable"></tbody>
            </table>
          </div>

          <aside class="detail" id="detailPanel">
            <p class="muted">Seleccione una postulacion.</p>
          </aside>
        </section>
      </section>
    </main>
    <script src="/admin/app.js"></script>
  </body>
</html>
